<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernraum zu zweit</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#241f3a;--mu:#6d6788;--ac:#6c4ef2;--ac2:#e9e4ff;--ok:#1f9d6b;--bad:#d64545;--bd:#e3def5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121f;--card:#201c30;--tx:#f0edfb;--mu:#a49dc2;--ac:#8f78ff;--ac2:#2c2644;--ok:#3ecf94;--bad:#ff7a7a;--bd:#2f2948}}
:root[data-theme="dark"]{--bg:#15121f;--card:#201c30;--tx:#f0edfb;--mu:#a49dc2;--ac:#8f78ff;--ac2:#2c2644;--ok:#3ecf94;--bad:#ff7a7a;--bd:#2f2948}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;margin:0 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.pet{text-align:center}.pet .e{font-size:64px;line-height:1.1}
.bar{height:10px;background:var(--ac2);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}.bar.ok i{background:var(--ok)}
.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac2);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#fff;font-weight:600}button.on{outline:2px solid var(--ac)}
.big{font-size:48px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.live{color:var(--ok);font-weight:600}.log{border-top:1px solid var(--bd);padding:10px 0;font-size:14px}
.log img,.pv{max-width:100%;max-height:260px;border-radius:10px;margin-top:6px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:5;overflow:auto}
.modal .card{width:100%;max-width:420px;margin:auto}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}.err{background:var(--bad);color:#fff;border-radius:12px;padding:10px;margin-bottom:12px}
</style></head><body><div id="app"><p class="card">Lade …</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
let CFG=null,ROOM="";
try{const m=location.hash.match(/cfg=([^&]+)/);if(m){localStorage.setItem("lr_cfg",atob(decodeURIComponent(m[1])));history.replaceState(null,"",location.pathname)}}catch(e){}
try{const o=JSON.parse(localStorage.getItem("lr_cfg")||"null");if(o){CFG=o.c;ROOM=o.r}}catch(e){}
const LV=[0,45,120,240,400,600,850,1150,1500,1900,2400,3000],PETS=["🥚","🐣","🐥","🐹","🐰","🐶","🦊","🐯","🦁","😺","🐱","🐈"];
let db,uid,members={},photos={},summary=null,pend=null,sel=25,dirty=false,werr=false,tab=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=()=>new Date().toLocaleDateString("sv");
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const D=d=>{const x=typeof d.data==="function"?d.data():d.data;if(x&&x.name==="Hanna")x.name="Hannah";return x};
const NAMES=["Linus","Hannah"],KINDS={exam:"Prüfungen",tasks:"Bearbeitete Aufgaben",time:"Lernzeit (Minuten)"},UNIT={exam:"Prüfungen",tasks:"Aufgaben",time:"Min"};
const me=()=>members[uid]||{name:uid,log:[],totalMin:0,exTotal:0,passTotal:0,tkTotal:0};
const kindOf=x=>x.goalKind||(x.name==="Linus"?"exam":"time");
function prog(x){const k=kindOf(x),per=x.goalPer||"day",key=k==="exam"?"ex":k==="tasks"?"tk":"min",tot=k==="exam"?x.exTotal:k==="tasks"?x.tkTotal:x.totalMin;
 const val=per==="total"?(tot||0):(x.log||[]).filter(l=>l.d===day()).reduce((a,l)=>a+(l[key]||0),0);const g=x.goalVal||0;
 return{val,g,pct:g?Math.min(100,Math.round(val/g*100)):0,txt:`${val} / ${g} ${UNIT[k]} ${per==="total"?"insgesamt":"heute"}`}}
function save(p){const n={...me(),...p};members[uid]=n;werr=false;db.doc("members/"+uid).set(n).catch(()=>{werr=true;render(true)});render(true)}
function saveGoals(){save({goalText:$("#gt").value.trim(),goalKind:$("#gk").value,goalVal:parseInt($("#gv").value)||0,goalPer:$("#gp").value})}
function openSummary(min){summary={min};pend=null;render(true)}
function finishNow(){const m=me();const el=Math.round((m.pausedLeft!=null?m.durMin*60000-m.pausedLeft:Date.now()-m.startedAt)/60000);openSummary(Math.max(1,Math.min(m.durMin,el)))}
function shrink(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};im.src=URL.createObjectURL(f)})}
function saveSummary(){const m=me(),k=kindOf(m);const n=id=>$(id)?Math.max(0,parseInt($(id).value)||0):0;
 const min=n("#smin"),ex=n("#sex"),ps=Math.min(ex,n("#sps")),tk=n("#stk"),note=$("#note").value.trim();let pids=[];
 (pend||[]).forEach((img,i)=>{const pid=uid+"_"+Date.now()+"_"+i;pids.push(pid);db.doc("photos/"+pid).set({img}).catch(()=>{werr=true;render(true)});photos[pid]=img});
 const log=[{d:day(),min,ex,ps,tk,note,g:m.goalText||"",pids},...(m.log||[])].slice(0,60);
 summary=null;pend=null;save({startedAt:null,pausedLeft:null,log,totalMin:(m.totalMin||0)+min,exTotal:(m.exTotal||0)+ex,passTotal:(m.passTotal||0)+ps,tkTotal:(m.tkTotal||0)+tk})}
function render(force){
 const a=document.activeElement;
 if(!force&&(summary||(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")))){dirty=true;return}
 dirty=false;const m=me();const app=$("#app");
 if(!m.name){app.innerHTML='<h1>Lernraum zu zweit</h1><div class="card"><h2>Wer bist du?</h2><div class="row"><button class="p" data-n="Linus">Ich bin Linus</button><button class="p" data-n="Hannah">Ich bin Hannah</button></div></div>';
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>save({name:b.dataset.n}));return}
 const all=Object.entries(members),byName=n=>all.find(([,x])=>x.name===n);
 const total=all.reduce((s,[,x])=>s+(x.totalMin||0),0);
 let lv=0;LV.forEach((t,i)=>{if(total>=t)lv=i});const nxt=LV[lv+1];const pct=nxt?Math.round((total-LV[lv])/(nxt-LV[lv])*100):100;
 const ch=all.find(([id,x])=>id!==uid&&x.lastCheer&&Date.now()-x.lastCheer<3e5);let h='<h1>Lernraum zu zweit</h1>'+(ch?`<div class="card" style="text-align:center">👏 ${esc(ch[1].name)} feuert dich an!</div>`:"")+(werr?'<div class="err">Speichern klappt gerade nicht. Vermutlich hast du nur Leserechte oder bist nicht eingeloggt. Bitte lass dich als Mitwirkende einladen.</div>':'');
 h+=`<div class="card pet"><div class="e">${PETS[lv]}</div><b>Level ${lv+1} von ${LV.length}</b><div class="bar"><i style="width:${pct}%"></i></div><div class="mu">${nxt?`Noch ${nxt-total} Min bis zum nächsten Level`:"Eure Katze ist ausgewachsen! 🎉"} · gemeinsam ${Math.round(total/6)/10} Std gelernt</div></div>`;
 h+='<div class="card"><h2>Im Raum</h2>';
 NAMES.forEach(n=>{const e=byName(n);if(!e){h+=`<div style="margin-bottom:10px"><b>${n}</b> <span class="mu">noch nicht beigetreten</span></div>`;return}
  const[id,x]=e,p=prog(x),lvv=x.startedAt&&Date.now()<x.startedAt+x.durMin*60000;
  h+=`<div style="margin-bottom:14px"><b>${n}${id===uid?" (du)":""}</b> ${lvv?`<span class="live">● lernt – <span data-end="${x.startedAt+x.durMin*60000}"></span></span>`:(x.pausedLeft!=null?'<span class="mu">⏸ Pause</span>':'<span class="mu">nicht am Lernen</span>')}
  <div class="mu">Ziel: ${esc(x.goalText||"noch keins")}</div><div class="bar ${p.pct>=100?"ok":""}"><i style="width:${p.pct}%"></i></div><div class="mu">${p.txt}</div>${id!==uid?'<button data-c="1">👏 Anfeuern</button>':""}${x.cheersSent?` <span class="mu">${x.cheersSent}× 👏 gesendet</span>`:""}</div>`});
 h+='</div>';
 const live=m.startedAt&&Date.now()<m.startedAt+m.durMin*60000;
 h+='<div class="card"><h2>Meine Session</h2>';
 if(m.pausedLeft!=null)h+=`<div class="big">${fmt(Math.ceil(m.pausedLeft/1000))}</div><p class="mu" style="text-align:center">Pausiert</p><div class="row" style="justify-content:center"><button class="p" id="res">▶ Weiter</button><button id="fin">Fertig / beenden</button></div>`;
 else if(live)h+=`<div class="big" data-end="${m.startedAt+m.durMin*60000}"></div><div class="row" style="justify-content:center"><button id="pau">⏸ Pause</button><button class="p" id="fin">Fertig / beenden</button></div><p class="mu" style="text-align:center">Der Timer läuft weiter, auch wenn du die Seite verlässt. Wenn du zurückkommst, siehst du die Restzeit.</p>`;
 else h+=`<label>Dauer</label><div class="row">${[15,25,45,60,90].map(n=>`<button class="${n===sel?"on":""}" data-d="${n}">${n} Min</button>`).join("")}</div><p><button class="p" id="go" style="width:100%">Session starten</button></p>`;
 h+='</div>';
 const t=NAMES.includes(tab)?tab:m.name;const te=byName(t),mine=te&&te[0]===uid;
 h+='<div class="card"><h2>Lernziele &amp; Rückblick</h2><div class="tabs">'+NAMES.map(n=>`<button class="${n===t?"on":""}" data-t="${n}">${n}</button>`).join("")+'</div>';
 if(!te)h+=`<p class="mu">${t} ist noch nicht beigetreten.</p>`;
 else{const x=te[1],k=kindOf(x),dis=mine?"":"disabled";
  h+=`<label>Ziel</label><input id="gt" ${dis} value="${esc(x.goalText||(k==="exam"?"Theorieprüfung":""))}" placeholder="z. B. Theorieprüfung">
  <div class="g2"><div><label>Art</label><select id="gk" ${dis}>${Object.entries(KINDS).map(([v,l])=>`<option value="${v}" ${v===k?"selected":""}>${l}</option>`).join("")}</select></div>
  <div><label>Anzahl / Länge</label><input id="gv" type="number" min="0" ${dis} value="${x.goalVal||0}"></div></div>
  <label>Zeitraum</label><select id="gp" ${dis}><option value="day" ${(x.goalPer||"day")==="day"?"selected":""}>pro Tag</option><option value="total" ${x.goalPer==="total"?"selected":""}>insgesamt (in der Zeit)</option></select>`;
  const wk=(x.log||[]).filter(l=>(Date.now()-new Date(l.d))<7*864e5).reduce((a,l)=>a+l.min,0);
  h+=`<div class="mu" style="margin-top:12px">Letzte 7 Tage: ${wk} Min · Prüfungen: ${x.exTotal||0} (${x.passTotal||0} bestanden) · Aufgaben: ${x.tkTotal||0}</div>`;
  (x.log||[]).slice(0,10).forEach(l=>{h+=`<div class="log"><b>${esc(l.d)}</b> · ${l.min} Min${l.g?" · "+esc(l.g):""}${l.ex?`<br>Prüfungen: ${l.ex}, bestanden: ${l.ps||0}, nicht bestanden: ${l.ex-(l.ps||0)}`:""}${l.tk?`<br>Aufgaben: ${l.tk}`:""}${l.note?`<br>${esc(l.note)}`:""}${(l.pids||(l.pid?[l.pid]:[])).map(p=>photos[p]?`<img src="${photos[p]}" alt="Foto">`:"").join("")}</div>`});
  if(!(x.log||[]).length)h+='<p class="mu">Noch keine Sessions.</p>'}
 h+='</div>';
 h+='<div class="card"><h2>Einladung</h2><p class="mu">Schick diesen Link per WhatsApp. Die andere Person muss nichts einrichten.</p><button id="inv">Link kopieren</button> <button id="sw">Person wechseln</button></div>';
 const k=kindOf(m);
 if(summary)h+=`<div class="modal"><div class="card"><h2>Was hast du geschafft?</h2><label>Gelernte Minuten</label><input id="smin" type="number" min="0" value="${summary.min}">
  ${k==="exam"?'<div class="g2"><div><label>Prüfungen gemacht</label><input id="sex" type="number" min="0" value="0"></div><div><label>davon bestanden</label><input id="sps" type="number" min="0" value="0"></div></div>':""}
  ${k==="tasks"?'<label>Bearbeitete Aufgaben</label><input id="stk" type="number" min="0" value="0">':""}
  <label>Fotos (Ergebnis oder Tagesfoto, bis zu 4)</label><input id="ph" type="file" accept="image/*" multiple><div id="pv"></div>
  <label>Notiz</label><textarea id="note" rows="3" placeholder="z. B. Kapitel 3 wiederholt"></textarea><p class="row"><button class="p" id="sv">Speichern</button><button id="sc">Verwerfen</button></p></div></div>`;
 app.innerHTML=h;
 if($("#fin"))$("#fin").onclick=finishNow;if($("#pau"))$("#pau").onclick=()=>{const m=me();save({pausedLeft:Math.max(0,m.startedAt+m.durMin*60000-Date.now()),startedAt:null})};if($("#res"))$("#res").onclick=()=>{const m=me();wake();save({startedAt:Date.now()+m.pausedLeft-m.durMin*60000,pausedLeft:null})};document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>save({cheersSent:(me().cheersSent||0)+1,lastCheer:Date.now()}));
 if($("#go")){$("#go").onclick=()=>{wake();save({startedAt:Date.now(),durMin:sel})};document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{sel=+b.dataset.d;render(true)})}
 if($("#sw"))$("#sw").onclick=()=>{if(confirm("Auf diesem Gerät eine andere Person wählen?")){localStorage.removeItem("who");location.reload()}};
 if($("#inv"))$("#inv").onclick=()=>{const u=location.origin+location.pathname+"#cfg="+encodeURIComponent(btoa(JSON.stringify({c:CFG,r:ROOM})));try{navigator.clipboard.writeText(u);$("#inv").textContent="Kopiert ✓"}catch(e){prompt("Link kopieren:",u)}};
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render(true)});
 if(mine&&$("#gt"))["#gt","#gk","#gv","#gp"].forEach(i=>$(i).onchange=saveGoals);
 if($("#sv")){$("#sv").onclick=saveSummary;$("#sc").onclick=()=>{summary=null;pend=null;save({startedAt:null,pausedLeft:null})};
  $("#ph").onchange=async e=>{const fs=[...e.target.files].slice(0,4);pend=[];for(const f of fs)pend.push(await shrink(f));$("#pv").innerHTML=pend.map(s=>`<img class="pv" src="${s}" alt="">`).join("")}}
 tick();
}
function tick(){
 document.querySelectorAll("[data-end]").forEach(el=>{el.textContent=fmt(Math.max(0,Math.ceil((+el.dataset.end-Date.now())/1000)))});
 const m=me();if(m.startedAt&&!summary&&Date.now()>=m.startedAt+m.durMin*60000)openSummary(m.durMin);
 const r=m.startedAt?Math.ceil((m.startedAt+m.durMin*60000-Date.now())/1000):0;document.title=r>0?fmt(r)+" · Lernraum":"Lernraum zu zweit";
}
let wl=null;async function wake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){tick();if(me().startedAt)wake()}});
document.addEventListener("focusout",()=>{if(dirty)setTimeout(()=>{const a=document.activeElement;if(!summary&&(!a||!["INPUT","TEXTAREA","SELECT"].includes(a.tagName)))render(true)},50)});
(async()=>{
 if(!CFG){const rc="raum-"+Math.random().toString(36).slice(2,8);
  $("#app").innerHTML=`<h1>Einrichtung</h1><div class="card"><label>1. Füge hier den firebaseConfig-Block aus Firebase ein</label><textarea id="cf" rows="6" placeholder='apiKey: "…", authDomain: "…", projectId: "…", appId: "…"'></textarea>
  <label>2. Raumcode (frei wählbar)</label><input id="rc" value="${rc}"><label>3. Diese Regeln in Firestore → Regeln einfügen</label><textarea id="ru" rows="9" readonly></textarea><p class="row"><button id="cp">Regeln kopieren</button><button class="p" id="sf">Speichern</button></p><p class="mu" id="em"></p></div>`;
  const upd=()=>{$("#ru").value=`rules_version = '2';\nservice cloud.firestore {\n match /databases/{database}/documents {\n  match /rooms/{room}/{document=**} {\n   allow read, write: if room == "${$("#rc").value.trim()}";\n  }\n }\n}`};upd();$("#rc").oninput=upd;
  $("#cp").onclick=()=>{$("#ru").select();try{navigator.clipboard.writeText($("#ru").value)}catch(e){document.execCommand("copy")}};
  $("#sf").onclick=()=>{const c={};[...$("#cf").value.matchAll(/(\w+)\s*:\s*["']([^"']+)["']/g)].forEach(x=>c[x[1]]=x[2]);const r=$("#rc").value.trim();
   if(!c.apiKey||!c.projectId||!c.appId||!r){$("#em").textContent="Es fehlen Werte. Kopiere den ganzen Block aus Firebase und vergib einen Raumcode.";return}
   localStorage.setItem("lr_cfg",JSON.stringify({c,r}));location.reload()};return}
 uid=localStorage.getItem("who");
 if(!uid){$("#app").innerHTML='<h1>Lernraum zu zweit</h1><div class="card"><h2>Wer bist du?</h2><div class="row"><button class="p" data-n="Linus">Ich bin Linus</button><button class="p" data-n="Hannah">Ich bin Hannah</button></div></div>';
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{localStorage.setItem("who",b.dataset.n);location.reload()});return}
 firebase.initializeApp(CFG);const fs=firebase.firestore(),base="rooms/"+ROOM+"/";
 db={doc:p=>fs.doc(base+p),collection:c=>fs.collection(base+c)};
 db.doc("members/"+uid).get().then(d=>{if(!d.exists)save({name:uid})}).catch(()=>{werr=true;render(true)});
 const t=setTimeout(()=>render(true),10000);
 db.collection("members").onSnapshot(s=>{clearTimeout(t);members={};(s.docs||[]).forEach(d=>{members[d.id]=D(d)});render()},()=>{$("#app").innerHTML='<p class="card">Daten konnten nicht geladen werden.</p>'});
 db.collection("photos").onSnapshot(s=>{photos={};(s.docs||[]).forEach(d=>{photos[d.id]=(D(d)||{}).img});render()},()=>{});
 setInterval(tick,1000);
})();
</script></body></html>
